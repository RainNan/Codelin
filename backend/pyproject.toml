[project]
name = "codelin-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "anyio>=4.0",
    "uvicorn[standard]>=0.30", # ASGI 服务器，standard 含 websockets/httptools
    "pydantic>=2.7", # 数据校验
    "pydantic-settings>=2.3", # .env 配置管理
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "sqlalchemy>=2.0", # SQLAlchemy 关系型数据库
    "psycopg[binary]>=3.2", # PostgreSQL 驱动
    "langgraph-checkpoint-postgres>=2.0", # LangGraph 状态快照存 Postgres
    "redis>=5.0",
    "python-jose[cryptography]>=3.3", # JWT
    "passlib[bcrypt]>=1.7", # 密码哈希
    "httpx>=0.27",
    "pgvector>=0.5.0",
    "bcrypt==4.3.0",
    "filelock>=3.16",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: 耗时集成测试", "eval: 评测集测试（M10）", "infra: 需要 PostgreSQL 与 Redis 的隔离集成测试"]
